name: Companion code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/hmc-matplotlib
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Test samplers and reproduction tools
        run: python -m unittest discover -s clt_qq -t . -v
      - name: Verify published paper data and figure manifest
        run: python -m clt_qq.verify_paper
